# Codemagic native builds for BooKoo.
#
# The QA workflows prove that the native iOS and Android projects still build.
# They use the QA app identity and no signing or store credentials, so they
# run the same for forks and pull requests. Lint, typecheck and tests stay in
# GitHub Actions (.github/workflows/ci.yml).
#
# Releases start from tags pushed to this repository:
#   v<version>     (e.g. v1.6.0)  ios-production + android-production. Signed store
#                  binaries go to TestFlight and a Play internal draft; review
#                  submission and production rollout stay manual store actions.
#   ota-<label>    (annotated; its message is the release note) ota-production
#                  publishes a Codemagic Patch update to the Production
#                  deployment through scripts/ota-release.zsh.
#   ota-dry-<label> runs every OTA gate without publishing.
# Each workflow can also be started by hand. They read every credential from the
# secure `bookoo_production` group. The GitHub webhook sends push and
# tag-creation events only: Codemagic builds a pull request from the yaml on its
# source branch, so PR events must not reach Codemagic until fork builds are
# proven unable to read that group.
#
# Every workflow runs on mac_mini_m2: the OpenIAP team plan offers no Linux
# instance, and the Mac image carries the Android SDK as well.

definitions:
  environment: &environment
    node: 22.14.0
    vars:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      BOOKOO_APP_VARIANT: qa
      BUN_VERSION: '1.3.13'
  triggering: &triggering
    events:
      - pull_request
    branch_patterns:
      - pattern: main
        include: true
        source: false
    cancel_previous_builds: true
  scripts:
    - &install_bun
      name: Install Bun
      script: |
        curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"
    - &install_dependencies
      name: Install dependencies
      script: bun install --frozen-lockfile
    - &load_production_env
      name: Load the EAS production environment
      script: |
        set -euo pipefail
        # eas-cli evaluates app.config.ts before it loads the environment, so
        # the production guards keyed on EAS_BUILD_* would reject the empty
        # EXPO_PUBLIC_* values here. They apply again from the next step on.
        env -u EAS_BUILD_PROFILE -u EAS_BUILD_PLATFORM \
          bunx eas-cli@23.0.0 env:exec production --non-interactive \
          'node scripts/codemagic/print-public-env.mjs' \
          | grep -E '^EXPO_PUBLIC_[A-Z0-9_]+=' > /tmp/bookoo-public.env
        test -s /tmp/bookoo-public.env
        cat /tmp/bookoo-public.env >> "$CM_ENV"
        echo "Loaded $(wc -l < /tmp/bookoo-public.env | tr -d ' ') EXPO_PUBLIC_* variables"
        rm /tmp/bookoo-public.env
    - &require_tag_on_main
      name: Require the tag to be on main
      script: |
        set -euo pipefail
        if [ -z "${CM_TAG:-}" ]; then echo "Started by hand on $(git rev-parse --short HEAD)"; exit 0; fi
        # A shallow clone cannot prove ancestry.
        [ "$(git rev-parse --is-shallow-repository)" = false ] || git fetch --quiet --unshallow origin
        git fetch --quiet origin main
        git merge-base --is-ancestor HEAD origin/main \
          || { echo "Tag $CM_TAG is not on main"; exit 1; }
    - &require_version_tag
      name: Match the tag to the app version
      script: |
        set -euo pipefail
        if [ -z "${CM_TAG:-}" ]; then exit 0; fi
        version=$(node -p 'require("./package.json").version')
        [ "$CM_TAG" = "v$version" ] \
          || { echo "Tag $CM_TAG does not match package.json $version"; exit 1; }
  version_tag: &version_tag
    events:
      - tag
    tag_patterns:
      - pattern: 'v*'
        include: true
  # YAML merge keys are shallow: each production workflow lists its own `vars`.
  # app.config.ts keys its production guards (required ad and map ids, no QA
  # identity) on the EAS_BUILD_* names, so these builds set them too.
  production_environment: &production_environment
    node: 22.14.0
    groups:
      - bookoo_production

workflows:
  ios-qa-simulator:
    name: iOS QA simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      xcode: latest
      cocoapods: default
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - name: Generate the iOS project
        script: bunx expo prebuild --no-install --platform ios
      - name: Install pods
        script: cd ios && pod install
      - name: Build for the iOS simulator
        script: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BooKooQA.xcworkspace \
            -scheme BooKooQA \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  android-qa-release:
    name: Android QA release build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
      java: 17
    triggering: *triggering
    scripts:
      - *install_bun
      - *install_dependencies
      - name: Generate the Android project
        script: bunx expo prebuild --no-install --platform android
      - name: Build the release APK
        script: cd android && ./gradlew :app:assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-production:
    name: iOS production (TestFlight upload)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BOOKOO_APP_VARIANT: production
        EAS_BUILD_PROFILE: production
        EAS_BUILD_PLATFORM: ios
        BUN_VERSION: '1.3.13'
        APP_STORE_APPLE_ID: '6805969489'
      xcode: latest
      cocoapods: default
    triggering: *version_tag
    scripts:
      - *require_tag_on_main
      - *require_version_tag
      - *install_bun
      - *install_dependencies
      - *load_production_env
      - name: Pick the next build number
        script: |
          set -euo pipefail
          testflight=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" | tail -1)
          store=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" | tail -1) || store=0
          [[ "$testflight" =~ ^[0-9]+$ && "$store" =~ ^[0-9]+$ ]]
          next=$(( (testflight > store ? testflight : store) + 1 ))
          echo "BOOKOO_BUILD_NUMBER=$next" >> "$CM_ENV"
          echo "Build number $next"
      - name: Install the App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          echo "$BOOKOO_IOS_DIST_P12_BASE64" | base64 --decode > /tmp/bookoo-dist.p12
          keychain add-certificates \
            --certificate /tmp/bookoo-dist.p12 \
            --certificate-password "$BOOKOO_IOS_DIST_P12_PASSWORD"
          rm /tmp/bookoo-dist.p12
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$BOOKOO_IOS_PROFILE_BASE64" | base64 --decode \
            > "$profiles/bookoo-app-store.mobileprovision"
      - name: Generate the iOS project
        script: bunx expo prebuild --no-install --platform ios
      - name: Install pods
        script: cd ios && pod install
      - name: Build the signed IPA
        script: |
          set -euo pipefail
          # Without --project it rewrites every .xcodeproj in the checkout,
          # node_modules included, and fails on the first library project.
          xcode-project use-profiles --project ios/BooKoo.xcodeproj
          xcode-project build-ipa \
            --workspace ios/BooKoo.xcworkspace \
            --scheme BooKoo
      - name: Check the bundle carries the production backend
        script: |
          set -euo pipefail
          host=$(node -p 'new URL(process.env.EXPO_PUBLIC_CONVEX_URL).host')
          ipa=$(ls build/ios/ipa/*.ipa)
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          unzip -p "$ipa" 'Payload/BooKoo.app/main.jsbundle' | grep -a -c "$host" > /dev/null
          echo "main.jsbundle targets $host"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  android-production:
    name: Android production (Play internal draft)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        EXPO_NO_DOTENV: '1'
        STAGE: production
        BOOKOO_APP_VARIANT: production
        EAS_BUILD_PROFILE: production
        EAS_BUILD_PLATFORM: android
        BUN_VERSION: '1.3.13'
        PACKAGE_NAME: dev.hyo.bookoo
        # Public SHA-256 of the Play upload certificate. A release signed with
        # any other key fails here instead of at the Play upload.
        UPLOAD_CERT_SHA256: 'A1:86:1E:6C:45:25:63:64:F5:27:1D:7A:A9:76:95:9D:77:70:40:F2:3C:AD:14:39:55:16:A6:8A:B9:A4:B1:01'
      java: 17
    triggering: *version_tag
    scripts:
      - *require_tag_on_main
      - *require_version_tag
      - *install_bun
      - *install_dependencies
      - *load_production_env
      - name: Pick the next version code
        script: |
          set -euo pipefail
          latest=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" | tail -1)
          [[ "$latest" =~ ^[0-9]+$ ]]
          next=$((latest + 1))
          echo "BOOKOO_BUILD_NUMBER=$next" >> "$CM_ENV"
          echo "Version code $next"
      - name: Install the upload keystore
        script: |
          set -euo pipefail
          echo "$BOOKOO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > /tmp/bookoo-upload.jks
          echo "BOOKOO_UPLOAD_KEYSTORE_PATH=/tmp/bookoo-upload.jks" >> "$CM_ENV"
      - name: Generate the Android project
        script: |
          set -euo pipefail
          bunx expo prebuild --no-install --platform android
          echo "apply from: new File(rootDir, '../scripts/codemagic/release-signing.gradle')" \
            >> android/app/build.gradle
      - name: Build the signed app bundle
        script: cd android && ./gradlew :app:bundleRelease --no-daemon
      - name: Check the signature and the production backend
        script: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          # grep -c reads to the end; grep -q would close the pipe early and
          # pipefail would turn the writer's SIGPIPE (141) into a failure.
          keytool -printcert -jarfile "$aab" | grep -c "SHA256: $UPLOAD_CERT_SHA256" > /dev/null
          host=$(node -p 'new URL(process.env.EXPO_PUBLIC_CONVEX_URL).host')
          unzip -p "$aab" base/assets/index.android.bundle | grep -a -c "$host" > /dev/null
          echo "Signed with the upload key; bundle targets $host"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ota-production:
    name: OTA production (Codemagic Patch)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *production_environment
      vars:
        CI: '1'
        BUN_VERSION: '1.3.13'
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ota-*'
          include: true
    scripts:
      - name: Require the tag to be the tip of main
        script: |
          set -euo pipefail
          git fetch --quiet origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] \
            || { echo "OTA must publish the current main; ${CM_TAG:-this commit} is not its tip"; exit 1; }
          # ota-release.zsh insists on the main branch; a tag build is detached.
          git checkout -q -B main
      - *install_bun
      - *install_dependencies
      - name: Publish the OTA update
        script: |
          set -euo pipefail
          if [ -n "${CM_TAG:-}" ]; then
            message=$(git tag -l --format='%(contents:subject)' "$CM_TAG")
            [ "$(git cat-file -t "$CM_TAG")" = tag ] \
              || { echo "Use an annotated tag: its message is the release note"; exit 1; }
          else
            message="${OTA_MESSAGE:-}"
          fi
          case "${CM_TAG:-}" in ota-dry-*) export OTA_DRY_RUN=1 ;; esac
          # The tag is the explicit JavaScript/assets-only attestation that the
          # script asks for. Actions minutes are not available, so the CI check
          # commands run here on the exact commit.
          OTA_CONFIRM_COMPATIBLE=1 OTA_VERIFY=local OTA_MESSAGE="$message" \
            zsh scripts/ota-release.zsh all
