appId: dev.hyo.bookoo
name: Release candidate iPad portrait landscape and entry UX
env:
  LEDGER_ID: ns714ycjvtq4z653adfvfwpwn58dgdsk
  ITEM_ID: n576hmvb67ex9ph02m5c4awnc58dh8x0
---
- launchApp:
    stopApp: true
- setOrientation: PORTRAIT
- openLink: bookoo://
- extendedWaitUntil:
    visible:
      id: ledger-header-menu
    timeout: 30000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/010-calendar-portrait
- openLink: bookoo://timeline
- extendedWaitUntil:
    visible: All
    timeout: 60000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/011-timeline-portrait
- openLink: bookoo://ledger/${LEDGER_ID}/item/${ITEM_ID}
- extendedWaitUntil:
    visible:
      id: ledger-item-comment-field
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/012-entry-detail-two-pane
- openLink: bookoo://ledger/${LEDGER_ID}/item/${ITEM_ID}
- extendedWaitUntil:
    visible:
      id: ledger-item-comment-field
    timeout: 20000
- tapOn:
    id: ledger-item-comment-field
- inputText: Looks good for the monthly review.
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/013-comment-keyboard
- eraseText: 34
- hideKeyboard
- tapOn:
    id: ledger-item-more
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/014-entry-more
- tapOn:
    point: 85%,50%
- openLink: bookoo://ledger/${LEDGER_ID}/item/${ITEM_ID}/edit
- extendedWaitUntil:
    visible:
      id: entry-date-picker
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/015-entry-edit
- openLink: bookoo://stats
- extendedWaitUntil:
    visible: Total
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/016-stats-portrait
- openLink: bookoo://settings
- extendedWaitUntil:
    visible: Preferences
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/017-settings-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 5000
- openLink: bookoo://
- extendedWaitUntil:
    visible:
      id: ledger-header-menu
    timeout: 30000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/018-calendar-landscape
- openLink: bookoo://timeline
- extendedWaitUntil:
    visible: All
    timeout: 60000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/019-timeline-landscape
- openLink: bookoo://ledger/${LEDGER_ID}/item/${ITEM_ID}
- extendedWaitUntil:
    visible:
      id: ledger-item-comment-field
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/020-entry-detail-landscape
- openLink: bookoo://stats
- extendedWaitUntil:
    visible: Total
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/021-stats-landscape
- openLink: bookoo://settings
- extendedWaitUntil:
    visible: Preferences
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-02-server-authority/ios-ipad/interactions/022-settings-landscape
- assertNotVisible:
    id: app-error-fallback
- setOrientation: PORTRAIT
