appId: dev.hyo.bookoo
name: Release candidate iPad edit and landscape resume
env:
  LEDGER_ID: ns714ycjvtq4z653adfvfwpwn58dgdsk
  ITEM_ID: n576hmvb67ex9ph02m5c4awnc58dh8x0
---
- launchApp:
    stopApp: false
- tapOn:
    point: 85%,50%
- openLink: bookoo://ledger/${LEDGER_ID}/item/${ITEM_ID}/edit
- extendedWaitUntil:
    visible:
      id: entry-date-picker
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/015-entry-edit
- openLink: bookoo://stats
- extendedWaitUntil:
    visible: Total
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/016-stats-portrait
- openLink: bookoo://settings
- extendedWaitUntil:
    visible: Preferences
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/017-settings-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 5000
- openLink: bookoo://
- extendedWaitUntil:
    visible:
      id: ledger-header-menu
    timeout: 30000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/018-calendar-landscape
- openLink: bookoo://timeline
- extendedWaitUntil:
    visible: Coffee after work
    timeout: 60000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/019-timeline-landscape
- tapOn: Coffee after work
- extendedWaitUntil:
    visible: Coffee after work
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/020-entry-detail-landscape
- openLink: bookoo://stats
- extendedWaitUntil:
    visible: Total
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/021-stats-landscape
- openLink: bookoo://settings
- extendedWaitUntil:
    visible: Preferences
    timeout: 20000
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/022-settings-landscape
- assertNotVisible:
    id: app-error-fallback
- setOrientation: PORTRAIT
