appId: dev.hyo.bookoo
name: Android existing-fixture pagination and empty-day action
---
# Retained synthetic Home & Everyday: 96 entries, three per day. No reseed.
- assertVisible:
    id: authenticated-tab-shell
- tapOn: '^List$'
- tapOn: '^All$'
- scrollUntilVisible:
    element:
      text: 'August 20th, 2026'
    direction: DOWN
    timeout: 90000
- takeScreenshot: ${EVIDENCE_DIR}/60-timeline-page-two
- tapOn: '^Monthly$'
- assertVisible:
    id: calendar-next
- tapOn:
    id: calendar-next
- assertVisible:
    id: calendar-empty-add
- longPressOn:
    id: calendar-empty-add
- assertVisible:
    id: entry-route-header
- pressKey: BACK
- assertVisible:
    id: calendar-empty-add
- takeScreenshot: ${EVIDENCE_DIR}/61-empty-action-return
- tapOn:
    id: calendar-prev
- assertNotVisible:
    id: app-error-fallback
