appId: dev.hyo.bookoo
name: Release candidate iPad owner restore from OTP
---
- launchApp:
    stopApp: false
- assertVisible:
    id: auth-otp-input
- tapOn:
    id: auth-otp-input
- inputText: ${BOOKOO_E2E_OTP}
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/006-otp-keyboard
- tapOn: Next
- extendedWaitUntil:
    visible:
      id: authenticated-tab-shell
    timeout: 30000
- assertNotVisible:
    id: app-error-fallback
- takeScreenshot: docs/debugs/e2e/2026-09-01-release-candidate/ipad-mini/007-owner-ledger
